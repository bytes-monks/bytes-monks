<!DOCTYPE html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Legacy support for links captured by the old GitHub Pages 404 redirect.
         Every real route is prerendered now, so this only fires for old ?p=
         URLs. It must be a real navigation, not history.replaceState: the
         document already holds the home page's prerendered markup, and
         rewriting the URL under it would guarantee a hydration mismatch. -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var path = params.get('p');
        if (path) {
          var query = params.get('q');
          var url =
            window.location.protocol +
            '//' +
            window.location.host +
            '/' +
            decodeURIComponent(path) +
            (query ? '?' + decodeURIComponent(query) : '') +
            window.location.hash;
          window.location.replace(url);
        }
      })();
    </script>

    <title>Bytes Monks | Software, AI &amp; Tech Talent Sourcing</title>
